<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="Illustration of a rural Kazakh highway at dusk with cattle near the roadside and an amber electronic warning sign">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1421"/>
      <stop offset="0.55" stop-color="#122033"/>
      <stop offset="0.82" stop-color="#1B2C42"/>
      <stop offset="1" stop-color="#33331F"/>
    </linearGradient>
    <linearGradient id="duskGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1826"/>
      <stop offset="1" stop-color="#0A1119"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131D2B"/>
      <stop offset="1" stop-color="#1E2939"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="signGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#F5F7FA" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F5F7FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EA5BE" stop-opacity="0"/>
      <stop offset="1" stop-color="#8EA5BE" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="440" fill="url(#sky)"/>
  <rect y="330" width="1200" height="110" fill="url(#duskGlow)"/>

  <!-- Sparse stars -->
  <g fill="#F5F7FA">
    <circle cx="150" cy="70" r="1.6" opacity="0.5"/>
    <circle cx="330" cy="120" r="1.2" opacity="0.35"/>
    <circle cx="520" cy="58" r="1.4" opacity="0.4"/>
    <circle cx="700" cy="140" r="1.1" opacity="0.3"/>
    <circle cx="880" cy="76" r="1.5" opacity="0.45"/>
    <circle cx="1040" cy="130" r="1.2" opacity="0.3"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 428 L120 404 L260 420 L420 396 L560 418 L720 398 L880 420 L1030 402 L1200 422 L1200 440 L0 440 Z" fill="#0E1A2A"/>
  <path d="M0 434 L180 418 L360 432 L540 416 L760 434 L960 420 L1200 434 L1200 442 L0 442 Z" fill="#0B1421"/>

  <!-- Ground / steppe -->
  <rect y="436" width="1200" height="424" fill="url(#ground)"/>

  <!-- Horizon haze -->
  <rect y="380" width="1200" height="80" fill="url(#haze)"/>

  <!-- Road shoulders -->
  <path d="M660 434 L824 434 L1200 860 L232 860 Z" fill="#111B29"/>
  <!-- Road surface -->
  <path d="M668 433 L816 433 L1152 860 L298 860 Z" fill="url(#road)"/>

  <!-- Edge lines -->
  <path d="M666 433 L670.5 433 L306 860 L294 860 Z" fill="#F5F7FA" opacity="0.42"/>
  <path d="M813.5 433 L818 433 L1158 860 L1146 860 Z" fill="#F5F7FA" opacity="0.42"/>

  <!-- Center dashes (perspective) -->
  <g fill="#F5F7FA" opacity="0.5">
    <rect x="720" y="806" width="12" height="48" rx="2"/>
    <rect x="725.5" y="656" width="8" height="32" rx="1.5"/>
    <rect x="729.5" y="556" width="6" height="20" rx="1.2"/>
    <rect x="732" y="493" width="4" height="13" rx="1"/>
    <rect x="733.6" y="456" width="2.8" height="8" rx="0.8"/>
  </g>

  <!-- Roadside delineator posts with amber reflectors (left side) -->
  <g>
    <g fill="#0B1421">
      <rect x="336" y="742" width="6" height="52" rx="2"/>
      <rect x="512" y="600" width="5" height="40" rx="1.6"/>
      <rect x="620" y="518" width="4" height="28" rx="1.2"/>
      <rect x="676" y="478" width="3" height="18" rx="1"/>
    </g>
    <g fill="#F5A623">
      <rect x="336" y="748" width="6" height="7" rx="2" opacity="0.95"/>
      <rect x="512" y="605" width="5" height="5" rx="1.6" opacity="0.85"/>
      <rect x="620" y="522" width="4" height="4" rx="1.2" opacity="0.75"/>
      <rect x="676" y="481" width="3" height="3" rx="1" opacity="0.6"/>
    </g>
  </g>

  <!-- Electronic amber warning sign (right side, prototype unit) -->
  <g>
    <circle cx="1010" cy="382" r="150" fill="url(#signGlow)"/>
    <rect x="1004" y="452" width="12" height="196" fill="#0A1119"/>
    <rect x="930" y="286" width="160" height="168" rx="14" fill="#101C2C" stroke="#F5A623" stroke-width="5"/>
    <!-- Warning triangle with exclamation -->
    <path d="M1010 322 L1068 420 L952 420 Z" fill="none" stroke="#F5A623" stroke-width="7" stroke-linejoin="round"/>
    <rect x="1005" y="352" width="10" height="38" rx="5" fill="#F5A623"/>
    <circle cx="1010" cy="404" r="6" fill="#F5A623"/>
    <!-- LED status strip -->
    <rect x="962" y="428" width="96" height="8" rx="4" fill="#F5A623" opacity="0.85"/>
  </g>

  <!-- Headlight wash from the viewer's vehicle -->
  <ellipse cx="620" cy="860" rx="520" ry="260" fill="url(#lampGlow)"/>

  <!-- Livestock silhouettes -->
  <!-- Horse (left foreground) -->
  <g transform="translate(120 618) scale(1.35)" fill="#05080D">
    <ellipse cx="70" cy="45" rx="38" ry="17"/>
    <path d="M34 58 h5 v42 h-5 Z"/>
    <path d="M44 56 h5 v44 h-5 Z"/>
    <path d="M92 56 h5 v44 h-5 Z"/>
    <path d="M101 58 h5 v42 h-5 Z"/>
    <path d="M97 34 L118 8 L128 16 L110 48 Z"/>
    <ellipse cx="124" cy="13" rx="12" ry="6.4" transform="rotate(-22 124 13)"/>
    <ellipse cx="135" cy="19" rx="6" ry="4"/>
    <path d="M99 9 L104 0 L108 8 Z"/>
    <path d="M33 36 C20 50 18 72 14 88" stroke="#05080D" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M104 10 C110 18 108 26 104 32" stroke="#05080D" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Cow 1 (grazing, left of road) -->
  <g transform="translate(360 660) scale(1.5)" fill="#05080D">
    <ellipse cx="72" cy="54" rx="46" ry="21"/>
    <path d="M30 62 h6 v40 h-6 Z"/>
    <path d="M41 64 h6 v38 h-6 Z"/>
    <path d="M97 64 h6 v38 h-6 Z"/>
    <path d="M108 62 h6 v40 h-6 Z"/>
    <path d="M106 42 L130 30 L138 42 L114 56 Z"/>
    <ellipse cx="137" cy="38" rx="13" ry="8" transform="rotate(12 137 38)"/>
    <ellipse cx="148" cy="44" rx="7" ry="5" transform="rotate(12 148 44)"/>
    <path d="M128 28 C124 20 126 14 130 12" stroke="#05080D" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M138 28 C142 21 141 15 137 12" stroke="#05080D" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M28 44 C20 56 22 70 19 78" stroke="#05080D" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Cow 2 (standing closer to the road edge) -->
  <g transform="translate(520 570) scale(0.98)" fill="#05080D">
    <ellipse cx="72" cy="54" rx="45" ry="20"/>
    <path d="M32 62 h6 v38 h-6 Z"/>
    <path d="M43 63 h6 v37 h-6 Z"/>
    <path d="M96 63 h6 v37 h-6 Z"/>
    <path d="M107 62 h6 v38 h-6 Z"/>
    <path d="M105 43 L128 32 L136 43 L112 56 Z"/>
    <ellipse cx="135" cy="39" rx="12" ry="7.5" transform="rotate(8 135 39)"/>
    <ellipse cx="146" cy="44" rx="6.4" ry="4.6"/>
    <path d="M29 45 C22 56 24 68 21 76" stroke="#05080D" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="860" fill="url(#vig)"/>
</svg>
